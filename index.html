<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Consumables">
<meta name="theme-color" content="#0d0e10">
<title>CrewKit Consumables</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/*
VOICE: calm, quick, built for a cold truck tail-lift at 7am.
IDEA: the driver's clipboard sheet: two lists, a tick-off, a note sent to the gaffer.
PICTURE: the list itself, big rows, swipe right to sign a pack off.
COLOUR and TYPE: CrewKit dark, amber for actions, pink for gels, teal for consumables; system SF.
LAYOUT: header, two-way switch, list, bottom bar with Truck / Order.
*/
:root{color-scheme:dark;--bg:#0d0e10;--card:#17191c;--card2:#1f2226;--line:#2a2d33;--ink:#f3f3f4;--dim:#8d929b;--amber:#ffb020;--amberInk:#1a1200;--gel:#ff6fae;--cons:#35c9b8;--red:#ff5a52;--green:#3ccf6e;--safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px)}
:root[data-theme=light]{color-scheme:light;--bg:#f4f4f6;--card:#fff;--card2:#ececf0;--line:#dcdde2;--ink:#111214;--dim:#666b74;--amber:#e89400;--amberInk:#fff;--gel:#d92f7e;--cons:#0d9a8a}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-user-select:none;user-select:none}
input,textarea,button,select{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--safeT) + 10px) 16px 8px}
.hrow{display:flex;align-items:center;gap:10px}
.job{flex:1;text-align:left;padding:6px 0;min-height:44px}
.job b{display:block;font-size:24px;line-height:1.15;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job span{font-size:13px;color:var(--dim)}
.icon{width:44px;height:44px;border-radius:22px;background:var(--card);display:grid;place-items:center;font-size:22px;line-height:1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border-radius:14px;padding:4px;margin-top:8px}
.seg button{min-height:44px;border-radius:11px;font-weight:650;color:var(--dim);font-size:16px}
.seg button.on{background:var(--card2);color:var(--ink)}
.seg button.on.g{box-shadow:inset 0 -3px 0 var(--gel)}
.seg button.on.c{box-shadow:inset 0 -3px 0 var(--cons)}
.seg small{font-weight:500;opacity:.75;margin-left:4px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:40px;padding:0 14px;border-radius:20px;background:var(--card);font-weight:600;font-size:15px;color:var(--dim);white-space:nowrap}
.chips button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--cons)}
.chips.g button.on{box-shadow:inset 0 0 0 1.5px var(--gel)}
.chips small{opacity:.7;margin-left:5px;font-weight:500}
.chips .add{color:var(--amber)}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0 0 12px}
.chips.wrap button{background:var(--card2)}
.chips.wrap button.on{background:var(--gel);color:#2a0013;box-shadow:none}
.chips.wrap.c button.on{background:var(--cons);color:#00211d}
.olh{padding:10px 12px 2px;font-size:13px;color:var(--dim);font-weight:650;border-top:1px solid var(--line)}
.olh:first-child{border-top:0}
.ol.sub{border-top:0}
.newg{display:flex;gap:8px;margin:-4px 0 12px}
.newg input{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
.newg button{min-height:44px;padding:0 16px;border-radius:12px;background:var(--amber);color:var(--amberInk);font-weight:700}
.gl{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.gl input{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
.gl span{color:var(--dim);font-size:13px;min-width:54px;text-align:right}
.gl button{width:44px;height:44px;border-radius:12px;background:var(--card2);color:var(--red);font-size:20px}
.find{margin-top:8px;width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
main{flex:1;padding:6px 16px calc(150px + var(--safeB))}
.hint{color:var(--dim);font-size:13px;text-align:center;padding:4px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{position:relative;border-radius:16px;overflow:hidden;background:var(--card);touch-action:pan-y}
.row.drag,.row.snap{background:var(--green)}
.row .under{position:absolute;inset:0;visibility:hidden;display:flex;align-items:center;padding-left:20px;font-weight:700;color:#06210f}
.row .face{position:relative;display:flex;align-items:center;gap:10px;background:var(--card);min-height:68px;padding:8px 8px 8px 14px;transition:transform .18s ease}
.row.drag .face{transition:none}
.row .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--cons)}
.row.gel .bar{background:var(--gel)}
.row .nm{flex:1;text-align:left;padding:6px 0;min-height:44px}
.row .nm b{display:block;font-weight:600;font-size:17px;overflow-wrap:anywhere}
.row .nm span{font-size:13px;color:var(--dim)}
.row .ct{min-width:64px;min-height:52px;border-radius:12px;background:var(--card2);font-size:24px;font-weight:750;font-variant-numeric:tabular-nums}
.row.drag .under,.row.snap .under{visibility:visible}
.row.out .face>*{opacity:.45}
.row.out .ct{font-size:15px;font-weight:600}
.empty{text-align:center;color:var(--dim);padding:40px 12px}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;background:var(--amber);color:var(--amberInk);font-weight:700;font-size:17px;padding:0 16px}
.big.sec{background:var(--card2);color:var(--ink)}
.big.red{background:transparent;color:var(--red);border:1px solid var(--line)}
.big:disabled{opacity:.4}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(84px + var(--safeB));z-index:6;min-height:54px;border-radius:27px;background:var(--amber);color:var(--amberInk);font-weight:700;padding:0 20px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding:6px 16px calc(6px + var(--safeB))}
nav div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav button{min-height:52px;border-radius:12px;font-weight:650;color:var(--dim);position:relative}
nav button.on{color:var(--ink);background:var(--card2)}
.badge{display:inline-block;min-width:22px;padding:1px 6px;border-radius:11px;background:var(--amber);color:var(--amberInk);font-size:13px;font-weight:750;margin-left:6px}
h2{font-size:15px;font-weight:650;color:var(--dim);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
h2 .dot{width:10px;height:10px;border-radius:5px;background:var(--cons)}
h2 .dot.g{background:var(--gel)}
h2 .sp{flex:1}
.card{background:var(--card);border-radius:16px;overflow:hidden}
.ol{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:60px;border-top:1px solid var(--line)}
.ol:first-child{border-top:0}
.ol .q{font-size:20px;font-weight:750;min-width:56px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.ol .n{flex:1}
.ol .n span{display:block;font-size:13px;color:var(--dim)}
.step{display:flex;gap:6px}
.step button,.sbtn{width:44px;height:44px;border-radius:12px;background:var(--card2);font-size:22px;font-weight:600}
.pill{min-height:44px;padding:0 14px;border-radius:12px;background:var(--card2);font-weight:650;font-size:15px}
.pill.go{background:var(--green);color:#06210f}
.mini{font-size:14px;color:var(--amber);font-weight:650;min-height:36px;padding:0 6px}
#scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:720px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px 16px calc(16px + var(--safeB));max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .22s ease}
#sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
#sheet h3{margin:4px 0 12px;font-size:20px}
#sheet p{color:var(--dim);margin:0 0 12px;font-size:15px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
.fld input,.fld textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px}
.fld textarea{min-height:150px;resize:vertical;font-size:16px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.two button{min-height:50px;border-radius:12px;background:var(--card2);font-weight:650}
.two button.on.g{background:var(--gel);color:#2a0013}
.two button.on.c{background:var(--cons);color:#00211d}
.stack{display:flex;flex-direction:column;gap:8px}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qgrid button{min-height:60px;border-radius:14px;background:var(--card2);font-size:20px;font-weight:700}
.bigstep{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 16px}
.bigstep b{font-size:40px;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.bigstep button{width:60px;height:60px;border-radius:30px;background:var(--card2);font-size:30px}
.prev{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.pv{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:12px;padding:6px}
.pv input.q{width:56px;text-align:center;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px}
.pv input.nm{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:16px}
.pv .tg{min-width:52px;min-height:44px;border-radius:10px;font-weight:700;font-size:14px}
.pv .tg.g{background:var(--gel);color:#2a0013}
.pv .tg.c{background:var(--cons);color:#00211d}
.pv .x{width:40px;min-height:44px;color:var(--dim);font-size:20px}
.pv.warn input.q{border-color:var(--amber)}
pre.msg{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;font:15px/1.45 -apple-system,sans-serif;margin:0 0 12px;max-height:40vh;overflow:auto;-webkit-user-select:text;user-select:text}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:54px;padding:0 4px;border-top:1px solid var(--line);font-size:17px;text-align:left}
.menu button:first-child{border-top:0}
.menu button span{color:var(--dim);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(150px + var(--safeB));transform:translateX(-50%) translateY(20px);opacity:0;z-index:30;background:#2b2f35;color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);transition:.2s;pointer-events:none;font-size:15px}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{min-height:40px;padding:0 14px;border-radius:10px;background:var(--amber);color:var(--amberInk);font-weight:700}
#toast.plain{padding:12px 16px}
.foot{position:sticky;bottom:calc(-16px - var(--safeB));background:var(--card);padding:10px 0 calc(16px + var(--safeB));margin-bottom:calc(-16px - var(--safeB))}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--amber);border-radius:14px;padding:12px 8px 12px 14px;margin:6px 0 12px;font-size:15px}
.tip div{flex:1}.tip button{width:40px;height:40px;color:var(--dim);font-size:20px}
.ver{color:var(--dim);font-size:12px;text-align:center;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <button class="job" id="jobBtn"><b id="jobName">Consumables</b><span id="jobSub"></span></button>
      <button class="icon" id="menuBtn" aria-label="Menu">⋯</button>
    </div>
    <div class="seg" id="seg">
      <button data-c="gel" class="g">Gels<small id="nG"></small></button>
      <button data-c="cons" class="c">Consumables<small id="nC"></small></button>
    </div>
    <div class="chips" id="chips"></div>
    <input class="find" id="find" type="search" placeholder="Find" autocomplete="off">
  </header>
  <main id="main"></main>
</div>
<button class="fab" id="fab">+ Add</button>
<nav><div>
  <button id="tTruck" class="on">On the truck</button>
  <button id="tOrder">Order<span class="badge" id="oBadge" hidden></span></button>
</div></nav>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>
<script>
{
const VERSION = '0.3.1';
const KEY = 'crewkit-consumables:v1';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toLocaleDateString('en-GB', {day:'numeric', month:'short'});

/* ---------- storage ---------- */
let storageOk = true;
let S = load();
function blank() { return {v:1, cur:null, jobs:{}, driver:'', log:[]}; }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.jobs) { d.log = d.log || []; return d; } }
  } catch (e) { storageOk = false; }
  return blank();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
  catch (e) { if (storageOk) { storageOk = false; logIt('error', 'Could not save: ' + e.message); toast('Couldn’t save on this phone. Keep this page open.'); } }
}

/* ---------- diagnostics log ---------- */
function logIt(kind, msg) {
  S.log.push([new Date().toISOString(), kind, String(msg).slice(0, 300)]);
  if (S.log.length > 1500) S.log.splice(0, S.log.length - 1500);
}
window.addEventListener('error', e => { logIt('error', (e.message || 'error') + ' @' + (e.lineno || '?')); save(); });
window.addEventListener('unhandledrejection', e => { logIt('error', 'promise: ' + ((e.reason && e.reason.message) || e.reason)); save(); });

/* ---------- job + derived counts ---------- */
const job = () => S.jobs[S.cur] || null;
function newJob(name) {
  const id = uid();
  S.jobs[id] = {id, name: name || 'New job', created: Date.now(), items: [], ev: []};
  S.cur = id; logIt('job', 'New job: ' + name); save();
}
function addEv(type, item, n, extra) {
  const e = Object.assign({id: uid(), t: Date.now(), type, item, n}, extra || {});
  job().ev.push(e); return e;
}
function stats(j) {
  const m = {};
  for (const it of j.items) m[it.id] = {deliver:0, use:0, arrive:0, order:0, adj:0, lastOrder:0};
  for (const e of j.ev) {
    const s = m[e.item]; if (!s || e.undone) continue;
    if (e.type === 'deliver' || e.type === 'fix') s.deliver += e.n;
    else if (e.type === 'use') s.use += e.n;
    else if (e.type === 'back') s.use -= e.n;
    else if (e.type === 'arrive') s.arrive += e.n;
    else if (e.type === 'order') { s.order += e.n; s.lastOrder = e.t; }
    else if (e.type === 'adj') s.adj += e.n;
  }
  for (const id in m) {
    const s = m[id];
    s.truck = s.deliver + s.arrive - s.use;
    s.pending = Math.max(0, s.order - s.arrive);
    const owed = Math.max(0, s.use - s.arrive);
    s.toOrder = Math.max(0, owed - s.pending + s.adj);
  }
  return m;
}
const live = j => j.items.filter(i => !i.gone);

/* ---------- what's a gel ---------- */
const CONS_WORDS = /black ?wrap|cine ?foil|\bfoil\b|tape|\bclips?\b|crocs?|pegs?|\bties?\b|cable ties|sash|batter|\blamps?\b|bulbs?|fuses?|gloves?|spray|dulling|velcro|bungee|\brope\b|marker|sharpie|\bpens?\b|bin bags?|bags? of|wd-?40|zip|\bline\b|cord|gaffer/i;
const GEL_WORDS = /\bgels?\b|\bcto\b|\bctb\b|\bct ?o\b|\bnd\b|\bn\.d\.?|\blee\b|rosco|supergel|e-?colou?r|\bl\d{3}\b|frost|diffusion|\bdiff\b|\bopal\b|hampshire|grid ?cloth|silent ?grid|black scrim|leelux|heat shield|\bclear\b|soft (gold|silver)|lct|cyan|fresh pink|bright rose|follies|cosmetic|nectarine|apricot|peacock|plasma red|fern green|flame green|spring yellow|sun colou?r|tough ?spun|\bspun\b|\b(216|250|251|252|129|400|410|420|430|434|450|452|460|480)\b|\bwhite diff|\bstraw\b|bastard amber|plus green|minus green|\b(1\/2|1\/4|1\/8|half|quarter|eighth|full|double) (cto|ctb|white|plus|minus|blue|straw|nd)|tokyo blue|primary red|steel blue|dark blue|medium blue|lavender|chocolate|magenta|\bcolou?r (roll|sheet)/i;
function guessCat(name) {
  if (CONS_WORDS.test(name)) return 'cons';
  if (GEL_WORDS.test(name)) return 'gel';
  return 'cons';
}

/* ---------- categories within each list ----------
   Gels start as Diffusion / CTO / CTB / ND / ± Green / Specials; consumables start with none.
   Categories are kept for every job. Anything swapped by hand is remembered by name
   (S.learn), so the next sheet puts it in the right place straight away. */
const DEFAULT_GROUPS = {gel: [{id: 'diff', name: 'Diffusion'}, {id: 'cto', name: 'CTO'}, {id: 'ctb', name: 'CTB'}, {id: 'nd', name: 'ND'}, {id: 'green', name: '± Green'}, {id: 'spec', name: 'Specials'}], cons: []};
function ensureGroups() {
  if (!S.groups) S.groups = JSON.parse(JSON.stringify(DEFAULT_GROUPS));
  for (const c of ['gel', 'cons']) if (!Array.isArray(S.groups[c])) S.groups[c] = [];
  if (!S.learn) S.learn = {};
  for (const j of Object.values(S.jobs)) for (const it of j.items) if (it.grp === undefined) it.grp = autoGroup(it.name, it.cat);
}
function guessGroup(n) {
  if (/\bn\.?\s?d\b|\bnd\s?\.?\d|neutral density/i.test(n)) return 'nd';
  if (/(plus|minus|\+|−|-)\s*green|\b(pg|mg)\b/i.test(n)) return 'green';
  if (/\bcto\b|\bct\s?o\b|\bcts\b|\bct straw\b/i.test(n)) return 'cto';
  if (/\bctb\b|\bct\s?b\b/i.test(n)) return 'ctb';
  if (/diff|frost|opal|silk|grid|spun|leelux|hampshire|hannover|\b(216|250|251|252|129|400|410|420|430|434|450|452|460|480)\b|\b(full|half|quarter|eighth|\d\/\d) white\b|white diff/i.test(n)) return 'diff';
  return 'spec';
}
const groupsOf = cat => (S.groups && S.groups[cat]) || [];
const groupName = (cat, id) => { const g = groupsOf(cat).find(x => x.id === id); return g ? g.name : 'Other'; };
function grpOf(it) {
  const gs = groupsOf(it.cat);
  if (!gs.length) return null;
  return it.grp && gs.some(g => g.id === it.grp) ? it.grp : 'other';
}
function autoGroup(name, cat) {
  const gs = groupsOf(cat), has = id => gs.some(g => g.id === id);
  const l = S.learn && S.learn[norm(name)];
  if (l && l.cat === cat && l.grp && has(l.grp)) return l.grp;
  if (cat === 'gel') { const g = guessGroup(name); if (has(g)) return g; }
  return null;
}
function sections(items, cat) {
  const gs = groupsOf(cat);
  if (!gs.length) return [{g: null, items}];
  const out = gs.map(g => ({g, items: items.filter(i => grpOf(i) === g.id)}));
  out.push({g: {id: 'other', name: 'Other'}, items: items.filter(i => grpOf(i) === 'other')});
  return out.filter(s => s.items.length);
}
function addGroup(cat, name) {
  name = name.trim(); if (!name) return null;
  const hit = groupsOf(cat).find(g => g.name.toLowerCase() === name.toLowerCase());

    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    if (dx > 12 && dx > Math.abs(dy) && drag.dead) { drag.on = true; return; }
    if (dx > 12 && dx > Math.abs(dy)) { drag.on = true; drag.row.classList.add('drag'); try { drag.row.setPointerCapture(e.pointerId); } catch (_) {} }

function openEdit(it) {

  sheet(`<h3>Edit</h3>

    <div class="fld"><span id="eGl">Category</span></div>
    <div class="chips wrap" id="eGrp"></div>

    </div>`, sh => {
    const paint = () => {
      sh.querySelectorAll('.two button').forEach(b => b.classList.toggle('on', b.dataset.c === cat));
      const gs = groupsOf(cat);
      $('#eGl').textContent = listName(cat) + ' category';
      $('#eGrp').className = 'chips wrap' + (cat === 'gel' ? '' : ' c');
      $('#eGrp').innerHTML = gs.map(g => `<button data-g="${g.id}" class="${grp === g.id ? 'on' : ''}">${esc(g.name)}</button>`).join('') + `<button class="add" data-g="+">+ New</button>`;
      $('#eNew').hidden = !newOpen;
      $('#eT').textContent = total;
      $('#eInfo').textContent = `${Math.max(0, s.truck + total - s.deliver)} on the truck` + (s.use ? ` · ${s.use} used` : '') + (s.arrive ? ` · ${s.arrive} restocked` : '');
    };
    paint();
    sh.querySelectorAll('.two button').forEach(b => b.onclick = () => { if (cat !== b.dataset.c) { cat = b.dataset.c; grp = autoGroup(it.name, cat); } paint(); });
    $('#eGrp').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.g === '+') { newOpen = !newOpen; paint(); if (newOpen) $('#eNewG').focus(); return; }
      grp = grp === b.dataset.g ? null : b.dataset.g; paint();
    });
    const addNew = () => { const id = addGroup(cat, $('#eNewG').value); if (id) { grp = id; newOpen = false; $('#eNewG').value = ''; paint(); } };
    $('#eNewGo').onclick = addNew; $('#eNewG').onkeydown = e => { if (e.key === 'Enter') addNew(); };
    $('#eM').onclick = () => { if (total > 0 && s.truck + total - 1 - s.deliver >= 0) { total--; paint(); } };
    $('#eP').onclick = () => { total++; paint(); };
    $('#eDone').onclick = () => {
      const nm = $('#eName').value.trim();
      const msgs = [];
      if (nm && nm !== it.name) { addEv('rename', it.id, 0, {from: it.name, to: nm}); logIt('rename', `"${it.name}" → "${nm}"`); if (S.learn[norm(it.name)]) S.learn[norm(nm)] = S.learn[norm(it.name)]; it.name = nm; msgs.push('Renamed'); }
      const oldGrp = grpOf(it) === 'other' ? null : grpOf(it), moved = cat !== it.cat;
      if (moved) { addEv('move', it.id, 0, {from: it.cat, to: cat}); logIt('move', `${it.name}: ${it.cat} → ${cat}`); it.cat = cat; ui.cat = cat; msgs.push('Moved to ' + listName(cat)); }
      if (moved || grp !== oldGrp) {
        if (grp !== oldGrp) { addEv('group', it.id, 0, {from: oldGrp ? groupName(cat, oldGrp) : 'none', to: grp ? groupName(cat, grp) : 'none'}); logIt('group', `${it.name}: ${oldGrp ? groupName(cat, oldGrp) : 'none'} → ${grp ? groupName(cat, grp) : 'none'} (guess was ${cat === 'gel' ? groupName('gel', guessGroup(it.name)) : 'none'})`); if (!moved) msgs.push('Moved to ' + (grp ? groupName(cat, grp) : 'no category')); }
        it.grp = grp; S.learn[norm(it.name)] = {cat, grp};
        if (ui.grp[cat] !== 'all' && grp) ui.grp[cat] = grp;
      }
      const diff = total - s.deliver;
      if (diff) { addEv('fix', it.id, diff); logIt('fix', `${it.name}: delivered ${s.deliver} → ${total}`); msgs.push('Total changed'); }
      save(); closeSheet(); render(); if (msgs.length) toast(msgs.join(' · '));
    };
    const bk = $('#eBack'); if (bk) bk.onclick = () => { closeSheet(); act('back', it, 1, `1 × ${it.name} back on the truck`); };
    $('#eDel').onclick = () => askConfirm('Delete ' + it.name + '?', 'It comes off the list and the order. This is noted in the log.', 'Delete', () => {
      it.gone = true; addEv('delete', it.id, 0); logIt('delete', it.name); save(); render(); toast('Deleted ' + it.name);
    }, true);
  });
}

function openAdd() {
  sheet(`<h3>Add to the list</h3>
    <label class="big sec" style="margin-bottom:12px">Load a Sunbelt sheet (PDF)<input type="file" id="aFile" accept=".pdf,application/pdf" hidden></label>
    <p id="aMsg">Or paste or type it, one item per line. "10 x Black wrap", "Full CTO 3" and "GELS" / "CONSUMABLES" headings all work.</p>
    <label class="fld"><span>Delivery</span><textarea id="aTxt" placeholder="10 x Rolls of black wrap\n4 x Boxes of crocs\n2 x Hanks of sash\nFull CTO x 3"></textarea></label>
    <div id="aPrev" class="prev"></div>
    <div class="stack foot"><button class="big" id="aGo" disabled>Add</button><button class="big sec" id="aX">Cancel</button></div>`, () => {
    let rows = [], fromFile = [];
    const paint = () => {
      $('#aPrev').innerHTML = rows.length ? `<div class="fld"><span>Check these · tap Gel / Con to swap lists</span></div>` + rows.map((r, k) => `<div class="pv ${r.unsure ? 'warn' : ''}" data-k="${k}"><input class="q" inputmode="numeric" value="${r.qty}" aria-label="Quantity"><input class="nm" value="${esc(r.name)}" aria-label="Name"><button class="tg ${r.cat === 'gel' ? 'g' : 'c'}">${r.cat === 'gel' ? 'Gel' : 'Con'}</button><button class="x" aria-label="Remove">×</button></div>`).join('') + (rows.some(r => r.unsure) ? '<p>Amber boxes had no number, so they’re set to 1.</p>' : '') : '';
      $('#aGo').disabled = !rows.length;
      $('#aGo').textContent = rows.length ? `Add ${rows.length} item${rows.length > 1 ? 's' : ''}` : 'Add';
    };
    $('#aTxt').oninput = () => { rows = applyLearn(mergeRows(fromFile.concat(parseList($('#aTxt').value)))); paint(); };
    $('#aFile').onchange = async e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      $('#aMsg').textContent = 'Reading ' + f.name + '…';
      try {
        const pages = await readPdf(f), res = parseSunbelt(pages);
        if (!res.rows.length) {
          const sample = pages.flat().slice(0, 40).map(i => i.s).join(' | ').slice(0, 280);
          logIt('import', `Nothing found in ${f.name} (${pages.length} pages, Consumables heading ${res.found ? 'found' : 'not found'}). Text: ${sample}`);
          $('#aMsg').textContent = res.found ? 'Found the Consumables section, but nothing on it has a number.' : 'Couldn’t find a Consumables section on this sheet. Paste the list instead, then use Report a problem so this sheet can be added.';
        } else {
          const g = res.rows.filter(r => r.cat === 'gel').length;
          logIt('import', `${f.name}: ${g} gels, ${res.rows.length - g} consumables`);
          fromFile = res.rows;
          rows = applyLearn(mergeRows(fromFile.concat(parseList($('#aTxt').value))));
          $('#aMsg').textContent = `From ${f.name}: ${g} gels and ${res.rows.length - g} consumables. Check the numbers, then Add.`;
          paint();
        }
      } catch (err) { logIt('error', 'import ' + f.name + ': ' + err.message); $('#aMsg').textContent = err.message || 'Couldn’t read that file.'; }
      e.target.value = '';
    };
    $('#aPrev').addEventListener('input', e => {
      const k = +e.target.closest('.pv').dataset.k, r = rows[k];
      if (e.target.classList.contains('q')) { r.qty = Math.max(0, parseInt(e.target.value, 10) || 0); r.unsure = false; e.target.closest('.pv').classList.remove('warn'); }
      else r.name = e.target.value;
    });
    $('#aPrev').addEventListener('click', e => {
      const pv = e.target.closest('.pv'); if (!pv) return; const k = +pv.dataset.k;
      if (e.target.classList.contains('tg')) { rows[k].cat = rows[k].cat === 'gel' ? 'cons' : 'gel'; rows[k].flipped = true; paint(); }
      else if (e.target.classList.contains('x')) { rows.splice(k, 1); paint(); }
    });
    $('#aGo').onclick = () => {
      const j = job(); let added = 0, topped = 0;
      for (const r of rows) {
        const nm = r.name.trim(); if (!nm || r.qty <= 0) continue;
        let it = live(j).find(i => norm(i.name) === norm(nm));
        if (it) topped++;
        else { it = {id: uid(), name: nm, cat: r.cat, grp: autoGroup(nm, r.cat)}; j.items.push(it); added++; if (r.flipped) logIt('guess', `"${nm}" guessed ${guessCat(nm)}, set to ${r.cat}`); }
        addEv('deliver', it.id, r.qty);
      }
      logIt('add', `Added ${added} new, topped up ${topped} (${rows.length} lines pasted)`);
      if (rows.length) ui.cat = rows.some(r => r.cat === ui.cat) ? ui.cat : rows[0].cat;
      save(); closeSheet(); render(); toast(`${added} added${topped ? ', ' + topped + ' topped up' : ''}`);
    };
    $('#aX').onclick = closeSheet;
  });
}

function orderText(j, st, items) {
  const lines = [`${j.name}`, `Consumables order, ${today()}`];
  for (const c of ['gel', 'cons']) {
    const a = items.filter(i => i.cat === c && st[i.id].toOrder > 0);
    if (!a.length) continue;
    lines.push('', c === 'gel' ? 'GELS' : 'CONSUMABLES');
    const secs = sections(a, c);
    for (const s of secs) {
      if (s.g && secs.length > 1) lines.push(s.g.name + ':');
      for (const i of s.items) lines.push(`${st[i.id].toOrder} × ${i.name}`);
    }
  }
  if (S.driver) lines.push('', 'From ' + S.driver);
  return lines.join('\n');
}
function openSend() {
  const j = job(), st = stats(j), items = live(j);
  const txt = orderText(j, st, items);
  const canShare = !!navigator.share && window.top === window;
  sheet(`<h3>Send the order</h3><pre class="msg">${esc(txt)}</pre>
    <label class="fld"><span>Your name (goes at the bottom)</span><input id="sDrv" value="${esc(S.driver || '')}" placeholder="e.g. Dave" autocomplete="name"></label>
    <div class="stack">${canShare ? '<button class="big" id="sShare">Share…</button>' : ''}<button class="big ${canShare ? 'sec' : ''}" id="sCopy">Copy to paste in a message</button><button class="big sec" id="sX">Cancel</button></div>
    <p style="margin-top:12px">Once it's sent, these lines move to Waiting for delivery.</p>`, () => {
    const getTxt = () => { S.driver = $('#sDrv').value.trim(); return orderText(j, st, items); };
    $('#sDrv').oninput = () => { S.driver = $('#sDrv').value.trim(); save(); document.querySelector('pre.msg').textContent = orderText(j, st, items); };
    const done = how => {
      const n = items.reduce((a, i) => a + st[i.id].toOrder, 0);
      const ids = [];
      for (const i of items) { const s = st[i.id]; if (s.toOrder > 0) { ids.push(addEv('order', i.id, s.toOrder).id); if (s.adj) ids.push(addEv('adj', i.id, -s.adj).id); } }
      logIt('order', `Sent ${n} packs by ${how}`); save(); closeSheet(); render();
      ui.undo = ids;
      toast(how === 'copy' ? 'Copied · paste it in a message' : 'Order sent', () => {
        for (const ev of job().ev) if (ids.includes(ev.id)) ev.undone = true;
        logIt('undo', 'order send'); save(); render(); toast('Back on To order');
      });
    };
    const sh = $('#sShare');
    if (sh) sh.onclick = async () => {
      try { await navigator.share({text: getTxt()}); done('share'); }
      catch (e) { if (e && e.name === 'AbortError') return; logIt('error', 'share: ' + e.message); toast('Sharing didn’t work. Use Copy.'); }
    };
    $('#sCopy').onclick = async () => {
      const t = getTxt();
      if (await copyText(t)) done('copy');
      else { logIt('error', 'copy refused'); const p = document.querySelector('pre.msg'); selectEl(p); toast('Press and hold the text to copy it'); }
    };
    $('#sX').onclick = closeSheet;
  });
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
function selectEl(el) { try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {} }

/* ---------- report a problem ---------- */
function diagText(note) {
  const j = job(), L = [];
  L.push('CREWKIT CONSUMABLES REPORT', 'Version: ' + VERSION, 'Sent: ' + new Date().toString(), 'Device: ' + navigator.userAgent,
    `Screen: ${screen.width}x${screen.height} @${devicePixelRatio} · window ${innerWidth}x${innerHeight}`,
    'Saving: ' + (storageOk ? 'yes' : 'NO') + ' · data ' + Math.round(JSON.stringify(S).length / 1024) + 'KB',
    'Running: ' + (window.top !== window ? 'inside Claude' : standalone ? 'Home Screen app' : 'browser') + ' \u00b7 ' + location.host, '',
    'WHAT HAPPENED:', note || '(nothing typed)', '');
  if (j) {
    const st = stats(j);
    L.push('JOB: ' + j.name + ` (${live(j).length} items)`, 'list | name | delivered | truck | used | to order | on order');
    for (const i of live(j)) { const s = st[i.id]; L.push(`${i.cat}${grpOf(i) ? '/' + groupName(i.cat, grpOf(i)) : ''} | ${i.name} | ${s.deliver} | ${s.truck} | ${s.use} | ${s.toOrder} | ${s.pending}`); }
    const ch = j.ev.filter(e => e.type === 'rename' || e.type === 'move' || e.type === 'group');
    if (ch.length) { L.push('', 'NAME AND LIST CHANGES:'); for (const e of ch) { const it = j.items.find(x => x.id === e.item); L.push(e.type === 'rename' ? `rename "${e.from}" -> "${e.to}"` : `${e.type} "${it ? it.name : '?'}" ${e.from} -> ${e.to}`); } }
  }
  L.push('', 'CATEGORIES: gels ' + groupsOf('gel').map(g => g.name).join(', ') + ' · consumables ' + (groupsOf('cons').map(g => g.name).join(', ') || 'none'));
  L.push('', 'LOG (newest last):');
  for (const [t, k, m] of S.log.slice(-300)) L.push(`${t.slice(5, 19).replace('T', ' ')} ${k}: ${m}`);
  if (j) L.push('', '---DATA---', JSON.stringify({v: VERSION, job: j}));
  return L.join('\n');
}
function openDiag() {
  const canShare = !!navigator.share && window.top === window;
  sheet(`<h3>Report a problem</h3><p>Say what went wrong or what would help. This sends the app's log and the job's list so it can be fixed. Nothing else on the phone is included.</p>
    <label class="fld"><span>What happened?</span><textarea id="dNote" placeholder="e.g. Swiped Full CTO but it didn't go on the order"></textarea></label>
    <div class="stack">${canShare ? '<button class="big" id="dShare">Share…</button>' : ''}<button class="big ${canShare ? 'sec' : ''}" id="dCopy">Copy report</button><button class="big sec" id="dX">Cancel</button></div>`, () => {
    const sh = $('#dShare');
    const txt = () => { const n = $('#dNote').value.trim(); logIt('report', n.slice(0, 120) || 'sent'); save(); return diagText(n); };
    if (sh) sh.onclick = async () => {
      const t = txt();
      try {
        const f = new File([t], `consumables-report-${new Date().toISOString().slice(0, 10)}.txt`, {type: 'text/plain'});
        if (navigator.canShare && navigator.canShare({files: [f]})) await navigator.share({files: [f], title: 'CrewKit Consumables report'});
        else await navigator.share({text: t});
        closeSheet(); toast('Report sent · thanks');
      } catch (e) { if (e && e.name === 'AbortError') return; toast('Sharing didn’t work. Use Copy.'); }
    };
    $('#dCopy').onclick = async () => { if (await copyText(txt())) { closeSheet(); toast('Copied · paste it in a message to Jack'); } else toast('Couldn’t copy on this phone'); };
    $('#dX').onclick = closeSheet;
  });
}

/* ---------- toast ---------- */
let tT = null;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (undo ? '<button>Undo</button>' : '');
  t.classList.toggle('plain', !undo);
  if (undo) t.querySelector('button').onclick = () => { hideToast(); undo(); };
  t.classList.add('show'); clearTimeout(tT); tT = setTimeout(hideToast, undo ? 5000 : 2200);
}
function hideToast() { $('#toast').classList.remove('show'); }

/* ---------- wiring ---------- */
$('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { ui.cat = b.dataset.c; render(); scrollTo(0, 0); } });
$('#find').addEventListener('input', e => { ui.q = e.target.value; render(); });
$('#tTruck').onclick = () => { ui.tab = 'truck'; render(); scrollTo(0, 0); };
$('#tOrder').onclick = () => { if (!job()) return; ui.tab = 'order'; render(); scrollTo(0, 0); };
$('#fab').onclick = openAdd;
$('#menuBtn').onclick = openMenu;
$('#jobBtn').onclick = () => job() ? openJobs() : openNewJob();

ensureGroups();
logIt('open', 'v' + VERSION);
save(); render();
if (location.protocol === 'https:' && window.top === window && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
